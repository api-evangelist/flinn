aid: flinn
name: Flinn
description: 'Flinn (flinn.ai) is an AI-powered regulatory and quality platform for
  medical technology and in-vitro diagnostics (IVD) manufacturers. It automates post-market
  surveillance (PMS) and compliance obligations across global frameworks including
  the EU MDR, IVDR, and FDA 21 CFR requirements. The platform continuously monitors
  15+ safety databases in a single click, performs AI-assisted literature evaluation,
  automates complaint handling, and generates audit-ready reports for low- to high-risk
  medical devices. Flinn is used by 200+ global MedTech and IVD organizations, is
  hosted exclusively on AWS in Frankfurt (eu-central-1) with data kept inside the EU,
  and is validated/certified against ISO/IEC 27001:2022, ISO/TR 80002-2, IEC 62304,
  ISO 14971, FDA 21 CFR Part 11, the EU AI Act, and GDPR. Backed by HV Capital and
  Speedinvest. This profile has been enriched from Flinn''s public web presence; the
  product is a closed SaaS application with no public developer API at this time.'
